<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="at ad">
  <title id="at">Page assembly</title>
  <desc id="ad">Diagram: tokens feed the line and poster primitives, which compose the shell and pages, which mount into the route transition.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl { font-size: 9px; letter-spacing: 1.8px; fill: #6f6f73; }
      .ttl { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #111111; }
      .sub { font-size: 8.5px; letter-spacing: 1.4px; fill: #a4a4a8; }
    </style>
  </defs>
  <rect width="1200" height="340" fill="#ffffff"/>

  <!-- tokens -->
  <rect x="0" y="24" width="212" height="76" fill="#f3f3f2" stroke="#cfcfd2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="16" y="50" class="mono ttl">TOKENS</text>
  <text x="16" y="68" class="mono sub">paper / ink / signal</text>
  <text x="16" y="82" class="mono sub">tokens.css &#183; fonts.css</text>

  <!-- primitives -->
  <rect x="268" y="24" width="252" height="76" fill="#f3f3f2" stroke="#cfcfd2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="284" y="50" class="mono ttl">LINES + POSTER</text>
  <text x="284" y="68" class="mono sub">DashRule Frame ScanLine</text>
  <text x="284" y="82" class="mono sub">GhostText Swoosh Bracket</text>

  <!-- shell -->
  <rect x="576" y="24" width="212" height="76" fill="#111111"/>
  <text x="592" y="50" class="mono ttl" fill="#ffffff">SHELL</text>
  <text x="592" y="68" class="mono sub" fill="#a4a4a8">Navbar &#183; PageFrame</text>
  <text x="592" y="82" class="mono sub" fill="#a4a4a8">Cursor &#183; ScrollProgress</text>

  <!-- pages -->
  <rect x="844" y="24" width="212" height="76" fill="#ffe500"/>
  <text x="860" y="50" class="mono ttl">PAGES</text>
  <text x="860" y="68" class="mono sub" fill="#3a3a3c">Home &#183; Archive &#183; About</text>
  <text x="860" y="82" class="mono sub" fill="#3a3a3c">Projects &#183; NotFound</text>

  <!-- arrows -->
  <g stroke="#9a9aa0" stroke-width="1" fill="none">
    <path d="M212 62 H268" marker-end="url(#a)"/>
    <path d="M520 62 H576"/>
    <path d="M788 62 H844"/>
  </g>
  <g fill="#9a9aa0">
    <path d="M262 58 L270 62 L262 66 Z"/>
    <path d="M570 58 L578 62 L570 66 Z"/>
    <path d="M838 58 L846 62 L838 66 Z"/>
  </g>

  <!-- route transition feeding pages, drawn below -->
  <rect x="844" y="176" width="212" height="76" fill="#f3f3f2" stroke="#cfcfd2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="860" y="202" class="mono ttl">TRANSITION</text>
  <text x="860" y="220" class="mono sub">slab wipe 380&#8211;430ms</text>
  <text x="860" y="234" class="mono sub">reduced motion: fade</text>
  <path d="M950 100 V176" stroke="#9a9aa0" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  <path d="M946 170 L950 178 L954 170 Z" fill="#9a9aa0"/>

  <!-- stage viewer callout -->
  <rect x="576" y="176" width="212" height="76" fill="#f3f3f2" stroke="#cfcfd2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="592" y="202" class="mono ttl">STAGE VIEWER</text>
  <text x="592" y="220" class="mono sub">pager &#183; filmstrip</text>
  <text x="592" y="234" class="mono sub">zoom &#183; fullscreen</text>
  <path d="M682 176 V100" stroke="#9a9aa0" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  <path d="M678 106 L682 98 L686 106 Z" fill="#9a9aa0"/>

  <!-- bottom micro band -->
  <line x1="0" y1="296" x2="1200" y2="296" stroke="#cfcfd2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="0" y="318" class="mono lbl">DATA: characters.json &#183; banners.json</text>
  <text x="1000" y="318" class="mono lbl">BUILD: vite &#8594; dist</text>
</svg>
