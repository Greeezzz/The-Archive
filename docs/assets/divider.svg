<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 26" width="1200" height="26" role="presentation" aria-hidden="true">
  <defs>
    <style>
      .march { stroke-dasharray: 4 4; }
      .anim.march { animation: march 1.2s linear infinite; }
      .anim.pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes march { to { stroke-dashoffset: -8 } }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="26" fill="#ffffff"/>
  <line x1="26" y1="13" x2="1174" y2="13" stroke="#9a9aa0" stroke-width="1" class="march anim"/>
  <rect x="8"    y="8" width="9" height="9" fill="#9a9aa0"/>
  <rect x="1183" y="8" width="9" height="9" fill="#9a9aa0"/>
  <rect x="592" y="6" width="16" height="14" fill="#ffe500" stroke="#111111" stroke-width="1" class="pulse anim"/>
</svg>
