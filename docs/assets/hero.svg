<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="ht hd">
  <title id="ht">The Archive</title>
  <desc id="hd">Paper-white exhibition terminal: bracketed OF CHARACTERS title, hatched ghost lettering, hazard-yellow swoosh, halftone dots and dashed frame.</desc>

  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.9" fill="#cfcfd2" opacity="0.75"/>
    </pattern>
    <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5.5" height="11" fill="#e7e7e5"/>
    </pattern>
    <linearGradient id="swoosh" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#ffe500"/>
      <stop offset="1" stop-color="#b6ff2e"/>
    </linearGradient>
    <clipPath id="frame"><rect x="16" y="16" width="1168" height="428"/></clipPath>
    <style>
      .dash { stroke-dasharray: 4 4; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .disp { font-family: Archivo, "Arial Narrow", Helvetica, sans-serif; font-weight: 900; }
      @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
      @keyframes march { to { stroke-dashoffset: -16 } }
      @keyframes scan  { 0% { transform: translateY(0) } 100% { transform: translateY(428px) } }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      .anim.march { animation: march 1.4s linear infinite; }
      .anim.scan  { animation: scan 3.6s cubic-bezier(.76,0,.24,1) infinite; }
      .anim.blink { animation: blink 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="460" fill="#ffffff"/>
  <rect width="1200" height="460" fill="url(#dots)"/>

  <!-- outer dashed frame + corner handles -->
  <g clip-path="url(#frame)">
    <rect x="16.5" y="16.5" width="1167" height="427" fill="none" stroke="#cfcfd2" stroke-width="1" class="dash anim march"/>
  </g>
  <g fill="#9a9aa0">
    <rect x="11" y="11" width="10" height="10"/>
    <rect x="1179" y="11" width="10" height="10"/>
    <rect x="11" y="439" width="10" height="10"/>
    <rect x="1179" y="439" width="10" height="10"/>
  </g>

  <!-- micro text bands -->
  <text x="40" y="52" class="mono" font-size="9" letter-spacing="2.4" fill="#a4a4a8">THE ARCHIVE &#183; GALLERY &#183; OPERATOR FILES &#183; THE ARCHIVE &#183; GALLERY &#183; OPERATOR FILES</text>
  <line x1="40" y1="62" x2="1160" y2="62" stroke="#cfcfd2" stroke-width="1" class="dash"/>

  <!-- status slab -->
  <rect x="40" y="84" width="196" height="24" fill="#111111"/>
  <text x="52" y="100" class="mono" font-size="10" font-weight="700" letter-spacing="1.6" fill="#ffffff">31 OPERATOR DOSSIERS</text>
  <rect x="36" y="80" width="196" height="24" fill="none" stroke="#ffe500" stroke-width="1"/>
  <text x="252" y="100" class="mono" font-size="9" letter-spacing="2" fill="#6f6f73">SEC-00 // TERMINAL_ONLINE</text>
  <g class="anim blink">
    <rect x="1130" y="86" width="22" height="3" fill="#ff2bd6"/>
    <rect x="1130" y="92" width="13" height="3" fill="#00e5ff"/>
    <rect x="1130" y="98" width="18" height="3" fill="#7dff3a"/>
  </g>

  <!-- ghost hatched lettering -->
  <text x="38" y="392" class="disp" font-size="196" fill="url(#hatch)" letter-spacing="-6">ARCHIVE</text>

  <!-- kicker + bracket title -->
  <text x="46" y="168" class="mono" font-size="13" font-weight="600" letter-spacing="4.6" fill="#6f6f73">A CURATED ARCHIVE</text>

  <g stroke="#111111" stroke-width="6" fill="none">
    <path d="M46 196 H92 M46 196 V242"/>
    <path d="M700 196 H654 M700 196 V242"/>
    <path d="M46 356 H92 M46 356 V310"/>
    <path d="M700 356 H654 M700 356 V310"/>
  </g>
  <text x="76" y="330" class="disp" font-size="104" fill="#111111" letter-spacing="-3">OF CHARACTERS</text>

  <!-- swoosh: yellow to lime -->
  <path d="M760 258 C 850 250, 900 196, 1000 214 C 1076 228, 1096 268, 1156 236"
        fill="none" stroke="url(#swoosh)" stroke-width="26" stroke-linecap="round"/>
  <path d="M1136 214 L1162 232 L1136 250" fill="none" stroke="#b6ff2e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- scan line across the art zone -->
  <g class="anim scan">
    <line x1="16" y1="0" x2="1184" y2="0" stroke="#111111" stroke-width="1" opacity="0.5"/>
    <line x1="16" y1="-2" x2="1184" y2="-2" stroke="#ff2bd6" stroke-width="1" opacity="0.8"/>
    <line x1="16" y1="2" x2="1184" y2="2" stroke="#00e5ff" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- footer band -->
  <line x1="40" y1="404" x2="1160" y2="404" stroke="#cfcfd2" stroke-width="1" class="dash"/>
  <text x="40" y="424" class="mono" font-size="9" letter-spacing="2.4" fill="#a4a4a8">SYS.STATUS: OPERATIONAL</text>
  <text x="640" y="424" class="mono" font-size="9" letter-spacing="2.4" fill="#a4a4a8">EST. 2026 // CHELO ARCHIVE</text>
  <rect x="1104" y="416" width="56" height="3" fill="#ffe500"/>
</svg>
