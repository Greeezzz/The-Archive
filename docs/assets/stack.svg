  <text x="295" y="21" class="mono chip" fill="#ffffff">REACT ROUTER 7</text>

  <polygon points="441,0 517,0 525,8 525,30 449,30 441,22" fill="#ffe500"/>
  <text x="457" y="21" class="mono chip" fill="#111111">MOTION</text>

  <polygon points="535,0 636,0 644,8 644,30 543,30 535,22" fill="#111111"/>
  <text x="551" y="21" class="mono chip" fill="#ffffff">PLAIN CSS</text>

  <polygon points="654,0 756,0 764,8 764,30 662,30 654,22" fill="#f3f3f2" stroke="#cfcfd2" stroke-width="1"/>
  <text x="668" y="21" class="mono chip" fill="#3a3a3c">ZERO DEPS*</text>
</svg>
