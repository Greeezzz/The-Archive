<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 34" width="772" height="34" role="img" aria-label="Stack: React 19, Vite 8, React Router 7, Motion, plain CSS, no build-time dependencies">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl  { font-size: 11px; letter-spacing: 1.5px; fill: #6f6f73; }
      .chip { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>
  <rect width="760" height="34" fill="#ffffff"/>
