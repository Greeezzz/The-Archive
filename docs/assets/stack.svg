  <polygon points="74,0 167,0 175,8 175,30 82,30 74,22" fill="#111111"/>
  <text x="90" y="21" class="mono chip" fill="#ffffff">REACT 19</text>

  <polygon points="185,0 261,0 269,8 269,30 193,30 185,22" fill="#ffe500"/>
  <text x="201" y="21" class="mono chip" fill="#111111">VITE 8</text>

