<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional: a late swap repaints the h1 (was ~0.18 CLS on Home).
         Link tag, not @import: @import serialises behind the app stylesheet. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=optional"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>The Archive — by Chelo</title>
    <meta name="title" content="The Archive — by Chelo" />
    <meta name="description" content="A curated archive of original characters by Chelo. Each entry is a design study — a character, a world, a visual language built from scratch." />
    <meta name="author" content="Chelo Arung Samudro" />
    <meta name="theme-color" content="#080808" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.cheloarchive.my.id/" />
    <meta property="og:title" content="The Archive — by Chelo" />
    <meta property="og:description" content="A curated archive of original characters by Chelo. Design studies, storytelling, and visual craft." />
    <meta property="og:image" content="https://www.cheloarchive.my.id/logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.cheloarchive.my.id/" />
    <meta property="twitter:title" content="The Archive — by Chelo" />
    <meta property="twitter:description" content="A curated archive of original characters by Chelo. Design studies, storytelling, and visual craft." />
    <meta property="twitter:image" content="https://www.cheloarchive.my.id/logo.jpg" />
